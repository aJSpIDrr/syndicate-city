# Render Blueprint: the game website (static site) and the game server.
services:
  - type: web
    name: syndicate-city
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # paste the syndicate-city-api address, https://syndicate-city-eu.onrender.com
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

  # Game server next to the database (Neon is in Frankfurt).
  - type: web
    name: syndicate-city-eu
    runtime: node
    plan: free
    region: frankfurt # same place as the Neon database, so each tap's database trips stay short
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Any site may call the API: logins use a bearer token kept by the game page, not cookies.
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard
      - key: RESEND_API_KEY
        sync: false # from resend.com, for password-reset emails (optional: without it no emails are sent)
      - key: MAIL_FROM
        sync: false # e.g. Syndicate City <noreply@yourdomain.com> (a domain verified in Resend)
